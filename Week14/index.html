<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PyBullet 机器狗遥控器</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      background: #111827;
      color: #f3f4f6;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .panel {
      width: min(440px, 100%);
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 12px;
      padding: 18px;
    }
    h1 { margin: 0 0 8px; font-size: 20px; }
    p { color: #cbd5e1; line-height: 1.5; font-size: 14px; }
    .status {
      margin: 12px 0;
      padding: 9px 12px;
      border-radius: 8px;
      background: #0f172a;
      font-size: 14px;
    }
    .status.connected { color: #86efac; }
    .status.disconnected { color: #fca5a5; }
    #maze {
      width: 100%;
      background: #0b1220;
      border-radius: 10px;
      display: block;
      margin: 8px 0 4px;
    }
    .badge { font-size: 13px; margin: 6px 0 2px; }
    .badge .b { color: #fca5a5; font-weight: bold; }
    .badge .g { color: #86efac; font-weight: bold; }
    .pad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 14px 0;
    }
    button {
      min-height: 66px;
      border: none;
      border-radius: 10px;
      font-size: 22px;
      font-weight: bold;
      background: #2563eb;
      color: white;
      touch-action: manipulation;
    }
    button.secondary { background: #475569; }
    button.danger { background: #dc2626; }
    .telemetry {
      font-family: Consolas, monospace;
      background: #0f172a;
      border-radius: 8px;
      padding: 10px;
      font-size: 13px;
      line-height: 1.5;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="panel">
    <h1>PyBullet 机器狗遥控器</h1>
    <p>手机和电脑进入同一个 Tailscale 网络后打开本页。长按方向键持续控制，松开停止。</p>
    <div id="status" class="status disconnected">未连接</div>

    <canvas id="maze" width="400" height="400"></canvas>
    <div class="badge" id="badge"></div>

    <div class="pad">
      <div></div>
      <button data-move="1" data-turn="0">↑</button>
      <div></div>
      <button data-move="0" data-turn="1">←</button>
      <button id="stop" class="danger">■</button>
      <button data-move="0" data-turn="-1">→</button>
      <div></div>
      <button data-move="-1" data-turn="0">↓</button>
      <div></div>
    </div>

    <div style="display:flex; gap:8px; margin-bottom:6px;">
      <button id="autoBFS" style="flex:1; background:#059669; font-size:16px;">🧭 BFS 探索</button>
      <button id="autoAgent" style="flex:1; background:#7c3aed; font-size:16px;">🤖 AI Agent</button>
    </div>
    <button id="stopAuto" class="danger" style="width:100%; margin-bottom:6px; display:none;">⏹ 停止自动</button>
    <button id="reset" class="secondary" style="width:100%; margin-bottom: 12px;">重置位置</button>
    <div id="telemetry" class="telemetry">等待状态数据...</div>
  </div>

  <script>
    const statusEl = document.getElementById("status");
    const telemetryEl = document.getElementById("telemetry");
    const badgeEl = document.getElementById("badge");
    const canvas = document.getElementById("maze");
    const ctx = canvas.getContext("2d");
    const wsScheme = location.protocol === "https:" ? "wss" : "ws";
    const socket = new WebSocket(`${wsScheme}://${location.host}/ws`);

    let trail = [];

    socket.onopen = () => {
      statusEl.textContent = "已连接";
      statusEl.className = "status connected";
    };
    socket.onclose = () => {
      statusEl.textContent = "连接断开";
      statusEl.className = "status disconnected";
    };

    socket.onmessage = (event) => {
      const payload = JSON.parse(event.data);
      if (payload.type !== "state") return;
      const s = payload.data;
      telemetryEl.textContent =
        `x: ${s.position.x}   y: ${s.position.y}\n` +
        `yaw: ${s.yaw}\n` +
        `move: ${s.command.move}   turn: ${s.command.turn}`;
      let b = "";
      if (s.goal_reached) b = '<span class="g">到达终点！</span>';
      else if (s.auto_mode === "agent") {
        b = `🤖 AI Agent 决策中… 第 ${(s.agent?.call_count||0)} 次`;
        if (s.agent?.reasoning) b += `<br><small>推理: ${s.agent.reasoning}</small>`;
        if (s.agent?.latency_ms) b += ` | 延迟: ${s.agent.latency_ms}ms`;
      }
      else if (s.auto_mode === "bfs") b = `🧭 BFS 探索中… 路点 ${s.waypoint_idx}/${s.waypoints.length}`;
      else if (s.blocked) b = '<span class="b">前方撞墙，已被挡住</span>';
      else b = "手动控制";
      badgeEl.innerHTML = b;
      // 自动模式按钮切换
      const inAuto = !!s.auto_mode;
      document.getElementById("autoBFS").style.display = inAuto ? "none" : "block";
      document.getElementById("autoAgent").style.display = inAuto ? "none" : "block";
      document.getElementById("stopAuto").style.display = inAuto ? "block" : "none";
      if (s.maze) drawMaze(s);
    };

    function drawMaze(s) {
      const m = s.maze;
      const W = canvas.width, H = canvas.height;
      const sc = W / m.size;             // 米 -> 像素
      const toX = (x) => x * sc;
      const toY = (y) => H - y * sc;     // y 轴翻转：让上为正
      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = "#0b1220";
      ctx.fillRect(0, 0, W, H);
      // 墙
      ctx.fillStyle = "#3a5a93";
      for (const w of m.walls) {
        const x = toX(w.cx - w.hx), y = toY(w.cy + w.hy);
        ctx.fillRect(x, y, w.hx * 2 * sc, w.hy * 2 * sc);
      }
      // 终点 / 起点
      ctx.fillStyle = "rgba(34,197,94,0.85)";
      ctx.beginPath(); ctx.arc(toX(m.goal.x), toY(m.goal.y), m.goal.r * sc, 0, 7); ctx.fill();
      ctx.fillStyle = "rgba(245,158,11,0.8)";
      ctx.beginPath(); ctx.arc(toX(m.start.x), toY(m.start.y), m.goal.r * 0.7 * sc, 0, 7); ctx.fill();
      // 自动探索规划路径
      if (s.waypoints && s.waypoints.length > 1) {
        ctx.strokeStyle = "rgba(52,211,153,0.6)";
        ctx.lineWidth = 3;
        ctx.setLineDash([8, 6]);
        ctx.beginPath();
        for (let i = 0; i < s.waypoints.length; i++) {
          const wx = toX(s.waypoints[i].x), wy = toY(s.waypoints[i].y);
          i ? ctx.lineTo(wx, wy) : ctx.moveTo(wx, wy);
        }
        ctx.stroke();
        ctx.setLineDash([]);
        // 路点小圆点
        ctx.fillStyle = "rgba(52,211,153,0.7)";
        for (let i = s.waypoint_idx; i < s.waypoints.length; i++) {
          ctx.beginPath();
          ctx.arc(toX(s.waypoints[i].x), toY(s.waypoints[i].y), 3, 0, 7);
          ctx.fill();
        }
      }
      // 轨迹（完整保留，不做截断）
      const px = toX(s.position.x), py = toY(s.position.y);
      trail.push([px, py]);
      // 每隔 50 个点做一次降采样防止过多点拖慢渲染
      let drawTrail = trail;
      if (trail.length > 1000) {
        drawTrail = trail.filter((_, i) => i % 3 === 0 || i >= trail.length - 100);
      }
      ctx.strokeStyle = "rgba(56,189,248,0.7)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      drawTrail.forEach(([tx, ty], i) => i ? ctx.lineTo(tx, ty) : ctx.moveTo(tx, ty));
      ctx.stroke();
      // 机器狗（带朝向）
      ctx.fillStyle = s.goal_reached ? "#22c55e" : (s.blocked ? "#ef4444" : "#e2e8f0");
      ctx.beginPath(); ctx.arc(px, py, m.robot_radius * sc, 0, 7); ctx.fill();
      ctx.strokeStyle = "#fbbf24"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(px, py);
      ctx.lineTo(px + Math.cos(s.yaw) * m.robot_radius * sc * 1.8,
                 py - Math.sin(s.yaw) * m.robot_radius * sc * 1.8);
      ctx.stroke();
    }

    function sendCommand(move, turn) {
      if (socket.readyState !== WebSocket.OPEN) return;
      socket.send(JSON.stringify({ type: "command", move, turn }));
    }
    function stopRobot() {
      if (socket.readyState !== WebSocket.OPEN) return;
      socket.send(JSON.stringify({ type: "stop" }));
    }
    function bindHold(button) {
      const move = Number(button.dataset.move);
      const turn = Number(button.dataset.turn);
      const start = (e) => { e.preventDefault(); sendCommand(move, turn); };
      const stop = (e) => { e.preventDefault(); stopRobot(); };
      button.addEventListener("mousedown", start);
      button.addEventListener("mouseup", stop);
      button.addEventListener("mouseleave", stop);
      button.addEventListener("touchstart", start, { passive: false });
      button.addEventListener("touchend", stop, { passive: false });
      button.addEventListener("touchcancel", stop, { passive: false });
    }
    document.querySelectorAll("[data-move]").forEach(bindHold);
    document.getElementById("stop").addEventListener("click", stopRobot);
    document.getElementById("reset").addEventListener("click", () => {
      if (socket.readyState !== WebSocket.OPEN) return;
      trail = [];
      socket.send(JSON.stringify({ type: "reset" }));
    });
    document.getElementById("autoBFS").addEventListener("click", () => {
      if (socket.readyState !== WebSocket.OPEN) return;
      trail = [];
      socket.send(JSON.stringify({ type: "auto_explore" }));
    });
    document.getElementById("autoAgent").addEventListener("click", () => {
      if (socket.readyState !== WebSocket.OPEN) return;
      trail = [];
      socket.send(JSON.stringify({ type: "agent_explore" }));
    });
    document.getElementById("stopAuto").addEventListener("click", () => {
      if (socket.readyState !== WebSocket.OPEN) return;
      socket.send(JSON.stringify({ type: "stop_auto" }));
    });
  </script>
</body>
</html>
